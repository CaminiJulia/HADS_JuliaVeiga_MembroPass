name: membropass
description: "MembroPass: carteirinha digital white-label para programas de associados."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_svg: ^2.3.0
  http: ^1.6.0
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.4
  flutter_colorpicker: ^1.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/marca/

# Ícone do app (gerado a partir de assets/marca/icone.svg).
# Para regerar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: icone_app/icone.png
  adaptive_icon_background: "#2B2FB8"
  adaptive_icon_foreground: icone_app/icone_frente.png
